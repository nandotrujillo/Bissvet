<div class="login-container">

  <div class="login-card">

    <div class="logo-container">

      <div class="logo">

        <svg
          width="44"
          height="44"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <ellipse cx="5.2" cy="10" rx="2" ry="2.6"></ellipse>
          <ellipse cx="9.4" cy="7.2" rx="2" ry="2.6"></ellipse>
          <ellipse cx="14.6" cy="7.2" rx="2" ry="2.6"></ellipse>
          <ellipse cx="18.8" cy="10" rx="2" ry="2.6"></ellipse>
          <path d="M12 13.2c-2.2 0-4 .8-4.6 2.6-.3 1 .1 2.2 1.2 2.6.3.1.7.2 1 .2h4.8c.3 0 .7-.1 1-.2 1.1-.4 1.5-1.6 1.2-2.6-.6-1.8-2.4-2.6-4.6-2.6z"></path>
        </svg>

      </div>

      <h1>BissVet</h1>

      <p>Gestión veterinaria profesional</p>

    </div>

    <div class="form-group">

      <label>Usuario</label>

      <div class="input-container">

        <span class="input-icon">

          <svg
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
          </svg>

        </span>

        <input
          type="text"
          [(ngModel)]="Username"
          placeholder="Ingrese usuario"
          autocomplete="username"
        >

      </div>

    </div>


    <div class="form-group">

      <label>Contraseña</label>

      <div class="input-container">

        <span class="input-icon">

          <svg
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="4" y="11" width="16" height="10" rx="2"></rect>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
          </svg>

        </span>

        <input
          type="password"
          [(ngModel)]="PasswordHash"
          placeholder="Ingrese contraseña"
          autocomplete="current-password"
        >

      </div>

    </div>


    <div class="form-group">

      <label>Empresa</label>

      <div
        class="select-wrapper"
        [class.abierto]="empresasAbierto"
      >

        <button
          type="button"
          class="select-trigger"
          [class.placeholder]="!empresaSeleccionada"
          (click)="toggleEmpresas($event)"
        >

          <span class="select-iniciales">
            {{ inicialesEmpresa(empresaSeleccionada) }}
          </span>

          <span class="select-value">

            <strong>
              {{ empresaSeleccionada?.NombreComercial || 'Seleccione una empresa' }}
            </strong>

            <small *ngIf="empresaSeleccionada">
              NIT {{ empresaSeleccionada.Nit }}
            </small>

            <small *ngIf="!empresaSeleccionada">
              Elija la empresa a la que desea ingresar
            </small>

          </span>

          <svg
            class="select-arrow"
            [class.girada]="empresasAbierto"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>

        </button>

        <div
          class="select-panel"
          *ngIf="empresasAbierto"
          (click)="$event.stopPropagation()"
        >

          <div class="select-search">

            <svg
              class="search-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>

            <input
              type="text"
              [(ngModel)]="busquedaEmpresa"
              placeholder="Buscar empresa..."
            >

          </div>

          <div class="select-list">

            <button
              type="button"
              class="select-item"
              *ngFor="let empresa of empresasFiltradas"
              [class.seleccionada]="empresa.IdEmpresa === IdEmpresa"
              (click)="seleccionarEmpresa(empresa)"
            >

              <span class="select-iniciales select-iniciales-item">
                {{ inicialesEmpresa(empresa) }}
              </span>

              <span class="select-item-info">

                <strong>{{ empresa.NombreComercial }}</strong>

                <small>
                  {{ empresa.RazonSocial }}
                  <span *ngIf="empresa.Nit"> · NIT {{ empresa.Nit }}</span>
                </small>

              </span>

              <span
                class="check"
                *ngIf="empresa.IdEmpresa === IdEmpresa"
              >✓</span>

            </button>

            <div
              class="select-vacio"
              *ngIf="empresasFiltradas.length === 0"
            >
              Sin resultados para "{{ busquedaEmpresa }}"
            </div>

          </div>

        </div>

      </div>

    </div>


    <div
      class="mensaje-error"
      *ngIf="mensaje"
    >

      {{ mensaje }}

    </div>


    <button
      type="button"
      class="btn-login"
      (click)="ingresar()"
      [disabled]="cargando"
    >

      {{ cargando ? 'Ingresando...' : 'Ingresar' }}

    </button>


    <div class="login-footer">

      © 2026 <strong>BissVet</strong> · Todos los derechos reservados

    </div>

  </div>

</div>
