<div class="dashboard-container">

  <aside class="sidebar">

    <div class="logo">
      🐾 BissVet
    </div>

    <div
      class="empresa-actual"
      *ngIf="empresaNombre">
      {{ empresaNombre }}
    </div>

    <div
      class="plan-actual"
      *ngIf="planActual">
      Plan: {{ planActual }}
      <span class="estado-plan" [class.prueba]="planEstado === 'PRUEBA'"
        [class.activa]="planEstado === 'ACTIVA'"
        [class.vencida]="planEstado === 'VENCIDA'"
        [class.suspendida]="planEstado === 'SUSPENDIDA' || planEstado === 'CANCELADA'">
        {{ planEstado }}
      </span>
    </div>

    <nav>

      <!-- SECCIÓN FIJA: PANEL -->
      <div class="seccion">

        <button
          type="button"
          class="seccion-cabecera"
          [class.abierta]="panelAbierta"
          (click)="panelAbierta = !panelAbierta"
          [attr.aria-expanded]="panelAbierta">

          <span class="seccion-icono">🏠</span>
          <span class="seccion-titulo">Panel</span>
          <span class="seccion-flecha" [class.rotada]="!panelAbierta"></span>

        </button>

        <div class="seccion-items" [hidden]="!panelAbierta">

          <a
            routerLink="/dashboard"
            routerLinkActive="activo"
            [routerLinkActiveOptions]="{ exact: true }">
            <span class="item-icono">🏠</span>
            <span class="item-titulo">Inicio</span>
          </a>

          <a
            routerLink="/dashboard/mi-plan"
            routerLinkActive="activo">
            <span class="item-icono">📋</span>
            <span class="item-titulo">Mi Plan</span>
          </a>

        </div>

      </div>

      <!-- SECCIONES DINÁMICAS (agrupadas por categoría) -->
      <div class="seccion" *ngFor="let sec of secciones">

        <button
          type="button"
          class="seccion-cabecera"
          [class.abierta]="sec.abierta"
          (click)="toggleSeccion(sec)"
          [attr.aria-expanded]="sec.abierta">

          <span class="seccion-icono">{{ sec.icono }}</span>
          <span class="seccion-titulo">{{ sec.nombre }}</span>
          <span class="seccion-flecha" [class.rotada]="!sec.abierta"></span>

        </button>

        <div class="seccion-items" [hidden]="!sec.abierta">

          <a
            *ngFor="let mod of sec.modulos"
            [routerLink]="mod.Ruta || ''"
            routerLinkActive="activo">
            <span class="item-icono">{{ iconoModulo(mod) }}</span>
            <span class="item-titulo">{{ mod.NombreModulo }}</span>
          </a>

        </div>

      </div>

    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" (click)="salir()">
        Salir
      </button>
    </div>

  </aside>

  <main class="contenido-dashboard">

    <router-outlet></router-outlet>

  </main>

</div>
